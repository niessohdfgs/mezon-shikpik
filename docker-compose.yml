version: "3.9"

services:

  backend:
    build:
      context: ./backend

    container_name: tailoring_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - db
      - redis


  db:
    image: postgres:15

    container_name: tailoring_postgres

    environment:
      POSTGRES_DB: tailoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data



  redis:
    image: redis:7-alpine

    container_name: tailoring_redis

    restart: always

    ports:
      - "6379:6379"



volumes:

  postgres_data: